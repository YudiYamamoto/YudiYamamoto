name: Generate profile cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before snk: that Docker action creates dist/ as root, and this step could no longer write to it.
      # PROFILE_STATS_TOKEN (classic PAT, `repo` scope) makes private work count; without it only public repos do.
      - name: Generate monthly activity card
        run: bash .github/scripts/monthly-activity.sh ${{ github.repository_owner }} dist/monthly-activity.svg
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0038F7&color_dots=#ebedf0,#c6d4fd,#8aa8fb,#4d7cf9,#0038F7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#0038F7&color_dots=#2d333b,#0c2a5c,#1a4fa6,#2a65d1,#0038F7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
